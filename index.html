<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <!-- Viewport: viewport-fit=cover para notch de iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA -->
  <meta name="theme-color" content="#5B3DF6" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- iOS específico -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Syng" />

  <!-- Iconos iOS (requiere archivos en /public) -->
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- Splash screens iOS (opcional pero mejora experiencia de instalación) -->
  <!-- Se generan con herramientas como pwa-asset-generator -->

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Preconnect Firebase para reducir latencia inicial -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />


  <!-- Open Graph / WhatsApp / Facebook -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://syng-psi.vercel.app" />
  <meta property="og:title"       content="Syng — Organiza tu vida" />
  <meta property="og:description" content="Tareas, grupos y recordatorios en sincronía. Prueba Syng gratis." />
  <meta property="og:image"       content="https://syng-psi.vercel.app/icon-512.png" />
  <meta property="og:image:width"  content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:image:type"   content="image/png" />

  <!-- Twitter -->
  <meta name="twitter:card"        content="summary" />
  <meta name="twitter:title"       content="Syng — Organiza tu vida" />
  <meta name="twitter:description" content="Tareas, grupos y recordatorios en sincronía. Prueba Syng gratis." />
  <meta name="twitter:image"       content="https://syng-psi.vercel.app/icon-512.png" />
  <title>Syng</title>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    window.__installPrompt = null;
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      window.__installPrompt = e;
    });
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
