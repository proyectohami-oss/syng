<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <!-- Viewport: viewport-fit=cover para notch de iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA -->
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- iOS específico -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Syng" />

  <!-- Iconos iOS — PNG primero (Safari ignora SVG en share sheet) -->
  <link rel="apple-touch-icon" href="/syng-ios-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/syng-ios-icon.png" />
  <link rel="apple-touch-icon-precomposed" href="/syng-ios-icon.png" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- Compat legacy iOS -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Splash screens iOS (opcional pero mejora experiencia de instalación) -->
  <!-- Se generan con herramientas como pwa-asset-generator -->

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Preconnect Firebase para reducir latencia inicial -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />


  <!-- Open Graph / WhatsApp / Facebook -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://syng-psi.vercel.app" />
  <meta property="og:title"       content="Syng — Organiza tu vida" />
  <meta property="og:description" content="Tareas, grupos y recordatorios en sincronía. Prueba Syng gratis." />
  <meta property="og:image"       content="https://syng-psi.vercel.app/syng-ios-icon.png?v=7" />
  <meta property="og:image:width"  content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:image:type"   content="image/png" />

  <!-- Twitter -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Syng — Organiza tu vida" />
  <meta name="twitter:description" content="Tareas, grupos y recordatorios en sincronía. Prueba Syng gratis." />
  <meta name="twitter:image"       content="https://syng-psi.vercel.app/syng-ios-icon.png?v=7" />
  <title>Syng</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0A0A0A;
    }
    #root { min-height: 100%; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    window.__installPrompt = null;
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      window.__installPrompt = e;
    });
    /* PWA iOS: si el SW sirve index viejo, el JS 404 deja pantalla blanca — limpiar y recargar una vez */
    window.addEventListener("error", function(e) {
      var t = e.target;
      if (!t || t.tagName !== "SCRIPT" || !t.src || t.src.indexOf("/assets/") === -1) return;
      if (sessionStorage.getItem("syng_chunk_reload")) return;
      sessionStorage.setItem("syng_chunk_reload", "1");
      if (window.caches && caches.keys) {
        caches.keys().then(function(keys) {
          return Promise.all(keys.map(function(k) { return caches.delete(k); }));
        }).finally(function() { location.reload(); });
      } else {
        location.reload();
      }
    }, true);
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
