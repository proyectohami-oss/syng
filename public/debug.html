<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>SW Debug</title></head>
<body style="font-family:monospace;padding:20px;font-size:13px;line-height:1.8;">
<h2>SW Debug v2</h2>
<div id="out"></div>
<script>
async function run() {
  const o = document.getElementById('out')
  const log = t => { o.innerHTML += '<p>' + t + '</p>' }
  log('serviceWorker: ' + ('serviceWorker' in navigator))
  try {
    const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' })
    log('✅ registered: ' + reg.scope)
    log('active: ' + (reg.active?.scriptURL ?? 'none'))
    log('installing: ' + (reg.installing?.scriptURL ?? 'none'))
    log('waiting: ' + (reg.waiting?.scriptURL ?? 'none'))
  } catch(e) {
    log('❌ FAILED: ' + e.name + ' — ' + e.message)
  }
}
run()
</script>
</body>
</html>
